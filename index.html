<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кот ловит пирожные</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>
        <div id="hud">
            <div class="hud-item">🏆 <span id="score">0</span></div>
            <div class="hud-item">❤️ <span id="lives">3</span></div>
            <div class="hud-item">⭐ <span id="level">1</span></div>
        </div>
        <div id="overlay" class="hidden">
            <h1 id="overlay-title">Кот ловит пирожные</h1>
            <p id="overlay-text">Собери как можно больше пирожных!</p>
            <button id="start-btn">Играть</button>
        </div>
    </div>
    <script src="sdk.js"></script>
    <script src="game.js"></script>
</body>
</html>
