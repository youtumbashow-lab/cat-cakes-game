<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кот ловит пирожные</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game"></canvas>

        <div id="hud">
            <div class="hud-item">🏆 <span id="score">0</span></div>
            <div class="hud-item">❤️ <span id="lives">3</span></div>
            <div class="hud-item">📉 <span id="missed">0</span></div>
            <button id="pause-btn" title="Пауза (P / Esc)">⏸</button>
        </div>

        <div id="overlay" class="hidden">
            <h1 id="overlay-title">🐱 Кот ловит пирожные</h1>
            <p id="overlay-text">Лови пирожные корзиной! Не пропускай.</p>
            <button id="start-btn">Играть</button>
            <p class="hint">Управление: ← → или A / D · Пауза: P / Esc</p>
        </div>
    </div>
    <script src="sdk.js"></script>
    <script src="game.js"></script>
</body>
</html>
